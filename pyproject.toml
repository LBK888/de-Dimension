[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "somtrack"
version = "3.0.0"
description = "Locomotion metrics, multivariate analysis and publication figures for tracking data, with the statistics that decide what the figures may claim"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "SY Wang" },
    { name = "HP Ho" },
    { name = "BK Liao" },
]
keywords = ["self-organizing map", "SOM", "locomotion", "behaviour", "tracking",
            "TrackMate", "UMAP", "t-SNE", "PaCMAP", "PERMANOVA", "PERMDISP",
            "clustering", "dimensionality reduction", "biostatistics",
            "biophysics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "PySide6>=6.5",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5"]         # UMAP, densMAP, supervised UMAP
pacmap = ["pacmap>=0.7"]
phate = ["phate>=1.0"]
colour = ["glasbey>=0.2", "cmcrameri>=1.7"]
fast = ["numba>=0.58"]
shapes = ["shapely>=2.0"]          # smoother node-cluster outlines
all = ["umap-learn>=0.5", "pacmap>=0.7", "phate>=1.0", "glasbey>=0.2",
       "cmcrameri>=1.7", "numba>=0.58", "shapely>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
somtrack = "somtrack.cli:main"

[project.gui-scripts]
somtrack-gui = "somtrack.ui.app:main"

[tool.setuptools.packages.find]
include = ["somtrack*"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
